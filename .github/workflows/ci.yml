name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - name: Install Python SDK from uv.lock (reproducible)
        working-directory: sdks/python
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Generate cross-SDK fixture from TypeScript
        working-directory: sdks/typescript
        run: |
          npm install
          npx tsx ../python/tests/generate_ts_fixture.mjs
      - name: Run Python tests
        working-directory: sdks/python
        run: uv run --extra dev pytest -v
